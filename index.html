<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cell Simulation</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: white;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px;
    }

    #map {
      border: 2px solid #222;
      background: black;
      width: 50%;
      height: 50%;
      display: block;
    }

    #control-panel {
      border: 2px solid #333;
      width: 300px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
    }

    #control-panel h3 {
      margin-top: 0;
      text-align: center;
      color: #00ffcc;
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <canvas id="map" width="600" height="600"></canvas>
